<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17231f">
  <title>Offline — Tunu Library</title>
  <style>
    :root { color-scheme: light; --ink: #17231f; --muted: #718078; --paper: #f7f5ef; --leaf: #2f6b4f; --coral: #e46d4d; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: var(--paper); color: var(--ink); font-family: Manrope, system-ui, sans-serif; text-align: center; }
    main { width: min(100%, 560px); padding: clamp(30px, 7vw, 64px) clamp(22px, 6vw, 54px); border: 1px solid #dfe3da; border-radius: 25px 25px 25px 6px; background: rgba(255,255,255,.78); box-shadow: 0 24px 65px rgba(23,35,31,.1); }
    img { width: 76px; height: 76px; margin: 0 auto 24px; border-radius: 21px; object-fit: cover; box-shadow: 7px 7px 0 var(--coral); }
    .kicker { margin: 0 0 13px; color: var(--leaf); font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(39px, 8vw, 62px); font-weight: 400; letter-spacing: -.06em; line-height: .94; }
    p { max-width: 400px; margin: 17px auto 0; color: var(--muted); font-size: 13px; line-height: 1.75; }
    button { min-height: 43px; margin-top: 24px; padding: 12px 18px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; cursor: pointer; font: inherit; font-size: 12px; font-weight: 800; }
    button:hover { background: var(--leaf); }
  </style>
</head>
<body>
  <main>
    <img src="/static/logo/icon-192.png" alt="Tunu Library">
    <p class="kicker">A quiet reading break</p>
    <h1>You are offline.</h1>
    <p>Tunu Library could not reach the network. Your account, borrowing, reservation, and payment pages will be available again when the connection returns.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
