{% extends "base.html" %}

{% block title %}Sign In — Tunu Library{% endblock %}

{% block head %}
<style>
    .auth-wrapper {
        min-height: calc(100vh - 200px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
    }

    .auth-card {
        background: white;
        width: 100%;
        max-width: 440px;
        padding: 40px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .auth-header h1 {
        font-size: 26px;
        font-weight: 800;
        color: var(--primary);
    }

    .auth-header p {
        color: var(--text-muted);
        font-size: 14px;
        margin-top: 6px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 6px;
    }

    .form-control {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s ease;
    }

    .form-control:focus {
        border-color: var(--brand);
    }

    .auth-footer {
        margin-top: 24px;
        text-align: center;
        font-size: 14px;
        color: var(--text-muted);
    }

    .auth-footer a {
        color: var(--brand);
        font-weight: 700;
    }
    .inp-group{
        position: relative;

        .inp-icon{
            position: absolute;
            left: 10px;
            top: 25%;
            padding-right: 8px;
            border-right: 1px solid #11ff0026;
        }
        input{
            padding-left: 35px;
            border: 1px solid #0c460826;
        }
    }
    .or{
        display: flex;
        width:100%;
        justify-content: center;
        align-items: center;
        gap: 4px;
        margin-top: 9px;

        hr{
            height: min-content;
            flex-grow: 1;
            border-color: #0c460826;
            
        }
        span{
            width: fit-content;
            text-align: center;
            padding: 0 5px;
        }
    }
    .or-buttons{
        display: flex;
        align-items: center;
        width:100%;
        justify-content: center;
        gap: 20px;

    }
    .or-button{
        width: 40px;
        height: 40px;
        display: flex;
        border:2px solid currentColor;
        text-shadow:2px 5px 0px #0c460826;
        box-shadow:5px 4px 0px #0c460826;

        justify-content: center;
        align-items: center;
        border-radius: 50%;
        cursor: pointer;
        font-size: xx-large;
        &:hover{
            box-shadow:2px 5px 0px #0c460826;
            rotate: 5deg;
        }
        &:nth-child(1){
            color: orange;

        }
        &:nth-child(2){
            color: blue;
        }
        &:active{
            scale: 0.9;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Log in to borrow books</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="identity">Email or Username</label>

                <div class="inp-group">
                <div class="inp-icon"> <i class="fas fa-user-circle"></i></div>
                <input type="text" id="identity" name="identity" class="form-control" placeholder="Enter your email or username" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="inp-group">

                <div class="inp-icon"> <i class="fas fa-lock-open"></i></div>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-brand" style="width: 100%; padding: 12px; margin-top: 10px;">
                Sign In
            </button>
            <div class="or">
                <hr> <span>or</span> <hr>
            </div>
            <div class="or-buttons">
                <a class="or-button" href="{{ url_for('google_login') }}">
                    <i class="fab fa-google"></i>
                </a>
                <div class="or-button">
                    <i class="fab fa-facebook"></i>
                </div>
            </div>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Join Library</a>
        </div>
    </div>
</div>
{% endblock %}
